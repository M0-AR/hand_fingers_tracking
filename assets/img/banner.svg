<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">SurgicalAir — Touchless precision interface</title>
  <desc id="desc">A dark technical banner with a glowing 21-point hand skeleton and the words SurgicalAir, control the machine, touch nothing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#071120"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e0d0"/>
      <stop offset="0.55" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff8ee"/>
      <stop offset="0.5" stop-color="#35e0d0"/>
      <stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35e0d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#35e0d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf6e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffcf6e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wideGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1040" cy="180" r="300" fill="url(#glowCyan)"/>
  <circle cx="80" cy="330" r="260" fill="url(#glowGold)"/>
  <path d="M0 300 C 260 250, 420 330, 640 290 S 1040 250, 1280 300" fill="none" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="1"/>
  <path d="M0 316 C 260 266, 420 346, 640 306 S 1040 266, 1280 316" fill="none" stroke="#35e0d0" stroke-opacity="0.08" stroke-width="1"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="86" fill="#35e0d0" font-size="13" font-weight="700" letter-spacing="4.5">RESEARCH PROTOTYPE · TOUCHLESS INTERFACE</text>
    <text x="72" y="176" fill="#f4f8ff" font-size="76" font-weight="800" letter-spacing="-2">SURGICAL<tspan fill="url(#accent)">AIR</tspan></text>
    <text x="74" y="226" fill="#c8d7ee" font-size="25" font-weight="400">Control the machine. Touch nothing.</text>
    <text x="74" y="262" fill="#8fa3bf" font-size="15.5">A webcam becomes a 21-point hand sensor. A browser becomes a touchless control layer.</text>

    <g transform="translate(74, 292)">
      <rect width="132" height="34" rx="17" fill="#35e0d0" fill-opacity="0.08" stroke="#35e0d0" stroke-opacity="0.35"/>
      <text x="18" y="22" fill="#8ff8ee" font-size="12.5" font-weight="700" letter-spacing="1.2">21 LANDMARKS</text>
      <rect x="144" width="118" height="34" rx="17" fill="#4c8dff" fill-opacity="0.08" stroke="#4c8dff" stroke-opacity="0.35"/>
      <text x="162" y="22" fill="#b9d0ff" font-size="12.5" font-weight="700" letter-spacing="1.2">ON-DEVICE</text>
      <rect x="274" width="72" height="34" rx="17" fill="#ffcf6e" fill-opacity="0.08" stroke="#ffcf6e" stroke-opacity="0.35"/>
      <text x="292" y="22" fill="#ffe2a3" font-size="12.5" font-weight="700" letter-spacing="1.2">MIT</text>
    </g>
  </g>

  <g transform="translate(1032,190) scale(88,-88)" fill="none" filter="url(#softGlow)">
    <path d="M 0 -1.6 L -0.55 -1.1 L -0.85 -0.75 L -1 -0.45 L -1.05 -0.18
             M 0 -1.6 L -0.45 -0.2 L -0.5 0.35 L -0.52 0.7 L -0.53 1.0
             M -0.45 -0.2 L -0.08 -0.12 L -0.08 0.5 L -0.08 0.9 L -0.08 1.25
             M -0.08 -0.12 L 0.3 -0.18 L 0.32 0.42 L 0.33 0.78 L 0.34 1.05
             M 0.3 -0.18 L 0.62 -0.3 L 0.65 0.25 L 0.66 0.55 L 0.67 0.8
             M 0.62 -0.3 L 0 -1.6"
          stroke="url(#line)" stroke-width="0.028" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#8ff8ee">
      <circle cx="0" cy="-1.6" r="0.055"/>
      <circle cx="-0.55" cy="-1.1" r="0.040"/><circle cx="-0.85" cy="-0.75" r="0.040"/><circle cx="-1" cy="-0.45" r="0.040"/><circle cx="-1.05" cy="-0.18" r="0.055"/>
      <circle cx="-0.45" cy="-0.2" r="0.045"/><circle cx="-0.5" cy="0.35" r="0.040"/><circle cx="-0.52" cy="0.7" r="0.040"/><circle cx="-0.53" cy="1" r="0.055"/>
      <circle cx="-0.08" cy="-0.12" r="0.045"/><circle cx="-0.08" cy="0.5" r="0.040"/><circle cx="-0.08" cy="0.9" r="0.040"/><circle cx="-0.08" cy="1.25" r="0.055"/>
      <circle cx="0.3" cy="-0.18" r="0.045"/><circle cx="0.32" cy="0.42" r="0.040"/><circle cx="0.33" cy="0.78" r="0.040"/><circle cx="0.34" cy="1.05" r="0.055"/>
      <circle cx="0.62" cy="-0.3" r="0.045"/><circle cx="0.65" cy="0.25" r="0.040"/><circle cx="0.66" cy="0.55" r="0.040"/><circle cx="0.67" cy="0.8" r="0.055"/>
    </g>
    <g fill="#35e0d0" opacity="0.55">
      <circle cx="-1.05" cy="-0.18" r="0.16" fill="none" stroke="#35e0d0" stroke-opacity="0.35" stroke-width="0.012"/>
      <circle cx="-0.53" cy="1" r="0.13" fill="none" stroke="#35e0d0" stroke-opacity="0.30" stroke-width="0.012"/>
      <circle cx="-0.08" cy="1.25" r="0.13" fill="none" stroke="#35e0d0" stroke-opacity="0.30" stroke-width="0.012"/>
      <circle cx="0.34" cy="1.05" r="0.13" fill="none" stroke="#35e0d0" stroke-opacity="0.30" stroke-width="0.012"/>
      <circle cx="0.67" cy="0.8" r="0.13" fill="none" stroke="#35e0d0" stroke-opacity="0.30" stroke-width="0.012"/>
    </g>
  </g>

  <g opacity="0.5">
    <circle cx="1032" cy="190" r="150" fill="none" stroke="#35e0d0" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 10"/>
    <circle cx="1032" cy="190" r="190" fill="none" stroke="#4c8dff" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 14"/>
  </g>

  <text x="1208" y="338" text-anchor="end" fill="#61748f" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5">github.com/M0-AR/hand_fingers_tracking</text>
</svg>
