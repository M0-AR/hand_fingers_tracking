<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
  <title id="title">The 21 hand landmarks used by SurgicalAir</title>
  <desc id="desc">A numbered map of the 21 hand landmarks: wrist at 0, thumb tip at 4, index tip at 8, middle tip at 12, ring tip at 16, pinky tip at 20.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c15"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#35e0d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35e0d0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#35e0d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7dd3fc" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="640" height="860" rx="24" fill="url(#bg)"/>
  <rect width="640" height="860" rx="24" fill="url(#grid)"/>
  <circle cx="300" cy="620" r="250" fill="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="58" fill="#35e0d0" font-size="12" font-weight="700" letter-spacing="3">ANATOMY OF A SIGNAL</text>
    <text x="40" y="96" fill="#f4f8ff" font-size="31" font-weight="700" letter-spacing="-0.5">The 21-point hand</text>
    <text x="40" y="124" fill="#8fa3bf" font-size="14">Every gesture in this project is built from these dots.</text>
  </g>

  <g fill="none" stroke="url(#bone)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M300 812 L234 752 L198 710 L180 674 L174 642"/>
    <path d="M300 812 L246 644 L240 578 L238 536 L236 500"/>
    <path d="M246 644 L290 634 L290 560 L290 512 L290 470"/>
    <path d="M290 634 L336 642 L338 570 L340 526 L341 494"/>
    <path d="M336 642 L374 656 L378 590 L379 554 L380 524"/>
    <path d="M374 656 L300 812"/>
  </g>

  <g fill="#0b1524" stroke="#35e0d0" stroke-width="2">
    <circle cx="300" cy="812" r="8"/>
    <circle cx="234" cy="752" r="6"/><circle cx="198" cy="710" r="6"/><circle cx="180" cy="674" r="6"/><circle cx="174" cy="642" r="8"/>
    <circle cx="246" cy="644" r="6"/><circle cx="240" cy="578" r="6"/><circle cx="238" cy="536" r="6"/><circle cx="236" cy="500" r="8"/>
    <circle cx="290" cy="634" r="6"/><circle cx="290" cy="560" r="6"/><circle cx="290" cy="512" r="6"/><circle cx="290" cy="470" r="8"/>
    <circle cx="336" cy="642" r="6"/><circle cx="338" cy="570" r="6"/><circle cx="340" cy="526" r="6"/><circle cx="341" cy="494" r="8"/>
    <circle cx="374" cy="656" r="6"/><circle cx="378" cy="590" r="6"/><circle cx="379" cy="554" r="6"/><circle cx="380" cy="524" r="8"/>
  </g>
  <g fill="#ffcf6e" stroke="#0b1524" stroke-width="1.5">
    <circle cx="174" cy="642" r="11"/><circle cx="236" cy="500" r="11"/><circle cx="290" cy="470" r="11"/>
    <circle cx="341" cy="494" r="11"/><circle cx="380" cy="524" r="11"/><circle cx="300" cy="812" r="11"/>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f4f8ff" text-anchor="middle">
    <text x="300" y="817" fill="#071120">0</text>
    <text x="174" y="647" fill="#071120">4</text>
    <text x="236" y="505" fill="#071120">8</text>
    <text x="290" y="475" fill="#071120">12</text>
    <text x="341" y="499" fill="#071120">16</text>
    <text x="380" y="529" fill="#071120">20</text>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8fa3bf">
    <text x="214" y="756">1</text><text x="178" y="714">2</text><text x="160" y="676">3</text>
    <text x="252" y="638">5</text><text x="246" y="572">6</text><text x="244" y="530">7</text>
    <text x="296" y="630">9</text><text x="296" y="554">10</text><text x="296" y="506">11</text>
    <text x="342" y="638">13</text><text x="344" y="564">14</text><text x="346" y="520">15</text>
    <text x="380" y="652">17</text><text x="384" y="584">18</text><text x="386" y="548">19</text>
  </g>

  <g transform="translate(410, 200)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="-14" y="-24" width="212" height="420" rx="18" fill="#0a1320" fill-opacity="0.82" stroke="#1e3350"/>
    <text x="0" y="4" fill="#f4f8ff" font-size="15" font-weight="700">Read the hand</text>
    <text x="0" y="34" fill="#8fa3bf" font-size="12.5">21 points. 5 fingers. 1 wrist.</text>
    <g font-size="12">
      <circle cx="4" cy="66" r="5" fill="#ffcf6e"/><text x="18" y="70" fill="#c8d7ee">0 — wrist (anchor)</text>
      <circle cx="4" cy="94" r="5" fill="#ffcf6e"/><text x="18" y="98" fill="#c8d7ee">4 — thumb tip</text>
      <circle cx="4" cy="122" r="5" fill="#ffcf6e"/><text x="18" y="126" fill="#c8d7ee">8 — index tip</text>
      <circle cx="4" cy="150" r="5" fill="#ffcf6e"/><text x="18" y="154" fill="#c8d7ee">12 — middle tip</text>
      <circle cx="4" cy="178" r="5" fill="#ffcf6e"/><text x="18" y="182" fill="#c8d7ee">16 — ring tip</text>
      <circle cx="4" cy="206" r="5" fill="#ffcf6e"/><text x="18" y="210" fill="#c8d7ee">20 — pinky tip</text>
    </g>
    <line x1="0" y1="232" x2="184" y2="232" stroke="#1e3350"/>
    <text x="0" y="260" fill="#35e0d0" font-size="12" font-weight="700">x</text>
    <text x="24" y="260" fill="#8fa3bf" font-size="12">left / right</text>
    <text x="0" y="286" fill="#35e0d0" font-size="12" font-weight="700">y</text>
    <text x="24" y="286" fill="#8fa3bf" font-size="12">up / down</text>
    <text x="0" y="312" fill="#35e0d0" font-size="12" font-weight="700">z</text>
    <text x="24" y="312" fill="#8fa3bf" font-size="12">toward / away</text>
    <text x="0" y="344" fill="#61748f" font-size="11">Coordinates are normalized</text>
    <text x="0" y="361" fill="#61748f" font-size="11">to the camera image. z is</text>
    <text x="0" y="378" fill="#61748f" font-size="11">relative, not a calibrated</text>
    <text x="0" y="395" fill="#61748f" font-size="11">distance in centimetres.</text>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#61748f">
    <text x="40" y="842">Pinch = distance(4, 8). Rotation = angle(0 → 9). Curl = joint angles of 6/10/14/18.</text>
  </g>
</svg>
